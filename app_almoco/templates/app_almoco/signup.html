{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cadastro - Agendar Almoço</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'app_almoco/style.css' %}">
</head>
<body class="auth-page">
  <div class="auth-background" aria-hidden="true"></div>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo" aria-hidden="true">
        <i class="fas fa-utensils"></i>
      </div>
      <h2 class="auth-title">Criar Conta</h2>
      {% if error %}
        <p class="form-error">{{ error }}</p>
      {% endif %}
      <form method="post" action="{% url 'app_almoco:signup' %}">
        {% csrf_token %}
        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">
        </div>
        <div class="form-group">
          <label for="telefone">Telefone com DDD</label>
          <input type="text" id="telefone" name="telefone" data-phone-input inputmode="numeric" required placeholder="(00) 00000-0000">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Cadastrar</button>
        </div>
      </form>
      <p class="form-footer">
        Já possui uma conta? <a href="{% url 'app_almoco:login' %}">Entrar</a>
      </p>
    </div>
  </div>
  <script src="{% static 'app_almoco/phone.js' %}"></script>
</body>
</html>
